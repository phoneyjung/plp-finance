<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7EFE2">
<title>OWL CHA — เมนู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== 60 / 30 / 10 =====
     60% พื้น: ครีมกระดาษ · 30% โครงสร้าง: น้ำตาลไม้/ขาวนวล · 10% แอคเซนต์: ทอง */
  --c60:#F7EFE2;            /* พื้นหลังหลัก */
  --c60b:rgba(255,255,255,.72); /* การ์ด/ชิป = พื้นเดียวกันแต่สว่างขึ้น */
  --c30:#4C3324;            /* น้ำตาลไม้ — ตัวหนังสือ ปุ่มหลัก ชิปที่เลือก */
  --c30b:#8B7460;           /* น้ำตาลจาง — ข้อความรอง */
  --c10:#C08A3E;            /* ทอง — ใช้น้อยๆ เฉพาะจุดที่อยากให้ตาไปหยุด */
  --cream:var(--c60); --ink:#2B1C13; --brown:var(--c30); --muted:var(--c30b);
  --gold:var(--c10); --line:rgba(76,51,36,.12);
  --shadow:0 20px 44px -24px rgba(58,36,22,.6);
  /* ===== สเกลทอง (φ≈1.618) ===== */
  --t1:34px; --t2:21px; --t3:13px; --t4:10.5px;   /* ราคา · ชื่อ · คำอธิบาย · ป้ายเล็ก */
  --s1:34px; --s2:21px; --s3:13px; --s4:8px;      /* ระยะห่าง */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100dvh;overflow:hidden;overscroll-behavior:none;color:var(--ink);background:var(--cream);
  font-family:Kanit,"Noto Sans Thai",system-ui,sans-serif;font-weight:300;
  display:flex;flex-direction:column;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- animated background ---------- */
.bg{position:fixed;inset:0;z-index:-3;background:var(--cream);overflow:hidden}
.bg .photo{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .7s ease;z-index:0}
.bg .photo.on{opacity:1}
body.hasBg .bg .lay{mix-blend-mode:multiply;opacity:0}
body.hasBg .bg .lay.on{opacity:.55}
body.hasBg .bg .arc,body.hasBg .leaf{opacity:.14}
body.hasBg .bg .grain{opacity:.03}
/* ม่านครีมจางๆ ท้ายจอ — กันพื้นหลังเข้มกลืนตัวหนังสือ */
body.hasBg .bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;z-index:3;
  background:linear-gradient(to top,rgba(247,239,226,.94) 0%,rgba(247,239,226,.72) 42%,rgba(247,239,226,0) 100%)}
.bg .lay{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.bg .lay.on{opacity:1}
.bg .grain{
  position:absolute;inset:-50%;opacity:.05;z-index:2;pointer-events:none;
  background-image:radial-gradient(rgba(60,40,25,.9) .6px,transparent .6px);background-size:4px 4px
}
.bg .arc{
  position:absolute;left:50%;top:46%;width:132vw;height:132vw;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(255,255,255,.35);z-index:1
}
.bg .arc.b{width:96vw;height:96vw;border-style:dashed;border-color:rgba(255,255,255,.4)}
.leaf{position:absolute;opacity:.3;z-index:1}
.leaf.l1{left:-6vw;top:8%;width:40vw;transform:rotate(-18deg)}
.leaf.l2{right:-10vw;bottom:6%;width:52vw;transform:rotate(160deg)}

/* ---------- header ---------- */
header{padding:calc(10px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo{width:36px;height:36px;border-radius:12px;box-shadow:0 6px 14px -8px rgba(44,29,20,.7)}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:.15em}
.brand span{display:block;font-size:10px;color:var(--muted);margin-top:-2px}
.hours{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--brown);
  background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.dot{width:6px;height:6px;border-radius:50%;background:#3EA76B;box-shadow:0 0 0 3px rgba(62,167,107,.18)}

.catwrap{position:relative;flex:0 0 auto}
.catwrap::before,.catwrap::after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2;pointer-events:none}
.catwrap::before{left:0;background:linear-gradient(to right,var(--c60),rgba(247,239,226,0))}
.catwrap::after{right:0;background:linear-gradient(to left,var(--c60),rgba(247,239,226,0))}
.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;scroll-snap-align:center;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12.5px;color:var(--brown);white-space:nowrap;
  transition:.25s cubic-bezier(.2,.8,.2,1)}
.pill.on{background:linear-gradient(135deg,#4C3324,#2B1C13);color:#F6ECD9;border-color:transparent;
  box-shadow:0 12px 22px -14px rgba(44,29,20,.9);transform:translateY(-1px)}
.pill em{font-style:normal;font-size:13px}

/* ---------- ฮีโร่: แก้วใหญ่ด้านบน ---------- */
.hero{flex:1.9 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:2px 16px 0;position:relative}
.count{position:absolute;right:4px;top:0;font-size:10.5px;color:var(--muted);letter-spacing:.08em;z-index:5}
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden}
.stage .halo{position:absolute;width:60%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);
  filter:blur(6px)}
.stage .shadow{position:absolute;bottom:5%;width:42%;height:22px;border-radius:50%;
  background:rgba(70,45,25,.22);filter:blur(11px)}
.stage .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage .art.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.93)}100%{opacity:1;transform:none}}
.stage svg{height:100%;max-height:100%;width:auto;max-width:100%;filter:drop-shadow(0 22px 26px rgba(50,30,16,.28))}
.stage img.photo{width:auto;height:136%;max-width:none;object-fit:contain;
  opacity:0;transition:opacity .3s ease}
.stage img.photo.rdy{opacity:1}

.info{flex:0 0 auto;width:100%;transition:opacity .2s ease;
  background:rgba(255,255,255,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:11px 14px 12px;
  box-shadow:0 14px 30px -26px rgba(58,36,22,.6)}
.info.fade{opacity:0}
.row1{display:flex;align-items:baseline;gap:8px}
.row2{display:flex;align-items:center;gap:10px;margin-top:5px}
.best{flex:0 0 auto;align-self:center;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;color:#F6ECD9;padding:3px 8px;border-radius:999px;
  background:linear-gradient(135deg,#C08A3E,#8B5E22)}
.best[hidden]{display:none}
.nm{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz{flex:0 0 auto;display:flex;align-items:baseline;gap:3px}
.pz b{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1}
.pz i{font-style:normal;font-size:12px;color:var(--c10);font-weight:500}
.ds{flex:1;min-width:0;font-size:11px;line-height:1.4;color:#6B563F;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{flex:0 0 auto;display:flex;gap:9px;align-items:center}
.icons img{width:18px;height:18px;opacity:.6}

/* ตัวบอกว่าปัดซ้าย-ขวาได้ */
.swipeHint{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  margin:9px 0 3px;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.swipeHint b{font-weight:400;font-size:14px;color:var(--c10);display:inline-block;
  animation:nudge 2.2s ease-in-out infinite}
.swipeHint b.r{animation-delay:1.1s}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(-4px);opacity:1}}
.swipeHint b.r{animation-name:nudgeR}
@keyframes nudgeR{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(4px);opacity:1}}


/* ---------- แถบเมนูด้านล่าง: ปัดเลือกแก้ว ---------- */
/* แถบน้ำตาลกินพื้นที่แค่ครึ่งล่าง แก้วที่เลือกจะโผล่พ้นขอบบนของแถบขึ้นมาครึ่งใบ */
.strip{position:relative;flex:0 0 auto;margin:2px 12px 0;padding:0 0 12px}
.strip::before{content:"";position:absolute;left:0;right:0;top:60px;bottom:0;border-radius:26px;
  background:linear-gradient(140deg,#432E20,#241710);box-shadow:0 18px 38px -24px rgba(30,18,10,.95);z-index:0}
.deck{position:relative;z-index:1;display:flex;padding-top:38px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.spacer{flex:0 0 34%}
.item{flex:0 0 32%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;
  padding:2px 0 0;cursor:pointer}
.item .box{width:68px;height:68px;flex:0 0 68px;border-radius:50%;position:relative;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.28);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.item .box svg{height:88%;width:auto}
.item .box img.photo{width:134%;height:134%;max-width:none;object-fit:contain;opacity:0;transition:opacity .3s ease}
.item .box img.photo.rdy{opacity:1}
.item .cap{margin-top:26px;font-size:10px;line-height:1.25;text-align:center;max-width:100%;padding:0 4px;
  color:rgba(246,236,217,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.3s}
.item .cap b{display:block;font-weight:500;font-size:10px;color:rgba(192,138,62,.75);margin-top:2px}
.item.on .box{transform:scale(1.5) translateY(-11px);
  box-shadow:0 0 0 3px rgba(247,239,226,.9),0 14px 26px -10px rgba(20,12,6,.75)}
.item.on .cap{color:#F6ECD9;font-weight:500}
.item.on .cap b{color:var(--c10)}

.nav{position:absolute;top:51px;width:42px;height:42px;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:18px;color:var(--c30);z-index:6;
  box-shadow:0 10px 22px -12px rgba(20,12,6,.9)}
.nav.l{left:-8px}.nav.r{right:-8px}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:-16px;font-size:10px;color:var(--muted);
  z-index:5;animation:hint 2.4s ease-in-out infinite;transition:opacity .5s;white-space:nowrap}
@keyframes hint{0%,100%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 6px),0)}}

/* ---------- footer ---------- */
.dock{flex:0 0 auto;display:flex;gap:10px;padding:6px 16px calc(10px + env(safe-area-inset-bottom))}
.dk{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;
  font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:transform .18s}
.dk:active{transform:scale(.97)}
.dk.main{background:linear-gradient(135deg,#4C3324,#241710);color:#F6ECD9}
.dk.alt{background:rgba(255,255,255,.9);color:var(--brown);border:1px solid rgba(192,138,62,.32)}
.count{position:absolute;right:16px;top:6px;font-size:11px;color:var(--muted);letter-spacing:.08em;z-index:5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:470px){
  body{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px rgba(76,51,36,.08),0 30px 70px -30px rgba(60,40,25,.45)}
  .bg{left:50%;transform:translateX(-50%);width:430px;max-width:100vw}
}
</style>
</head>

function val(f){ if(!f)return null;
  if('stringValue' in f)return f.stringValue;
  if('integerValue' in f)return parseInt(f.integerValue,10);
  if('doubleValue' in f)return f.doubleValue;
  if('booleanValue' in f)return f.booleanValue; return null }
function fromDoc(d){var f=d.fields||{};return{
  id:(d.name||'').split('/').pop(),
  n:val(f.nameTh)||val(f.name)||'', en:val(f.name)||'', p:val(f.price)||0,
  c:val(f.category)||'อื่นๆ', desc:val(f.desc)||'', photo:val(f.photo)||'',
  prep:val(f.prepMin)||0, active:(f.active&&f.active.booleanValue===false)?false:true,
  sort:(val(f.sortOrder)==null?999:val(f.sortOrder))}}
async function loadMenu(){
  var out=[],token='',guard=0;
  do{
    var r=await fetch(FIRESTORE+'?pageSize=100'+(token?'&pageToken='+encodeURIComponent(token):''),{cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    var j=await r.json();
    (j.documents||[]).forEach(function(d){out.push(fromDoc(d))});
    token=j.nextPageToken||'';
  }while(token&&++guard<12);
  return out.filter(function(x){return x.active&&x.n});
}

/* ลบพื้นขาวของรูปสินค้าออกจริงๆ ในเครื่องลูกค้า → ไม่มีกล่องขาวแวบ */
var cutCache={};
/* CUT_BG=false (ค่าเริ่มต้น) = ไม่ตัดพื้นหลังในเครื่องลูกค้า — ปลอดภัยกับฟองชีส/วิปสีขาว
   ตั้ง true ได้เมื่อเปลี่ยนไปใช้รูป PNG พื้นโปร่งแล้ว */
function prepPhoto(url,cb){
  if(cutCache[url]!==undefined) return cb(cutCache[url]);
  var im=new Image();
  try{ im.crossOrigin='anonymous' }catch(e){}
  im.onload=function(){
    var res=url;
    try{
      var W=im.naturalWidth, H=im.naturalHeight;
      var c=document.createElement('canvas'); c.width=W; c.height=H;
      var x=c.getContext('2d'); x.drawImage(im,0,0);
      var d=x.getImageData(0,0,W,H), a=d.data;
      var isBg=function(i){                     /* ขาวจัดมาก = พื้นหลังของรูป */
        var o=i*4, r=a[o], g=a[o+1], bl=a[o+2];
        var mx=r>g?(r>bl?r:bl):(g>bl?g:bl), mn=r<g?(r<bl?r:bl):(g<bl?g:bl);
        return mx>=246 && mx-mn<=10;
      };
      /* ---- เปลี่ยนสีพื้นขาวรอบนอกให้เป็นสีครีมของหน้าเว็บ (ไม่ลบ → ไม่มีทางทำรูปแหว่ง) ---- */
      var n=W*H, seen=new Uint8Array(n), q=new Int32Array(n), head=0, tail=0;
      var CR=parseInt(PHOTO_BG.substr(1,2),16), CG=parseInt(PHOTO_BG.substr(3,2),16), CB=parseInt(PHOTO_BG.substr(5,2),16);
      function push(i){ if(i>=0&&i<n&&!seen[i]&&isBg(i)){ seen[i]=1; q[tail++]=i } }
      for(var xx=0;xx<W;xx++){ push(xx); push((H-1)*W+xx) }
      for(var yy=0;yy<H;yy++){ push(yy*W); push(yy*W+W-1) }
      while(head<tail){
        var pp=q[head++], px=pp%W;
        if(px>0) push(pp-1);
        if(px<W-1) push(pp+1);
        push(pp-W); push(pp+W);
      }
      for(var i3=0;i3<n;i3++){
        if(!seen[i3]) continue;
        var o3=i3*4;
        a[o3]=CR; a[o3+1]=CG; a[o3+2]=CB;
      }
      /* ไล่ขอบรอยต่อให้เนียน */
      for(var i4=0;i4<n;i4++){
        if(seen[i4]) continue;
        var xq=i4%W;
        var nb=(xq>0&&seen[i4-1])||(xq<W-1&&seen[i4+1])||(i4>=W&&seen[i4-W])||(i4<n-W&&seen[i4+W]);
        if(!nb) continue;
        var o4=i4*4, mx4=Math.max(a[o4],a[o4+1],a[o4+2]);
        if(mx4>238){ var t=(mx4-238)/17; if(t>1)t=1;
          a[o4]=Math.round(a[o4]*(1-t)+CR*t); a[o4+1]=Math.round(a[o4+1]*(1-t)+CG*t); a[o4+2]=Math.round(a[o4+2]*(1-t)+CB*t); }
      }
      x.putImageData(d,0,0);

      /* หากรอบของ "ตัวแก้ว" = พิกเซลที่ไม่ใช่พื้นหลัง */
      var left=W, top=H, right=-1, bot=-1;
      for(var yy2=0;yy2<H;yy2++){
        for(var xx2=0;xx2<W;xx2++){
          if(!seen[yy2*W+xx2]){
            if(xx2<left)left=xx2; if(xx2>right)right=xx2;
            if(yy2<top)top=yy2; if(yy2>bot)bot=yy2;
          }
        }
      }
      var bw=right-left+1, bh=bot-top+1;
      if(bw>10 && bh>10){
        var S=900, k=Math.min(S*0.52/bh, S*0.52/bw);   /* ทุกแก้วขนาดเท่ากัน + เว้นที่ไล่ขอบ */
        var nw=Math.round(bw*k), nh=Math.round(bh*k);
        var c2=document.createElement('canvas'); c2.width=S; c2.height=S;
        var x2=c2.getContext('2d');
        x2.imageSmoothingQuality='high';
        x2.drawImage(c, left,top,bw,bh, Math.round((S-nw)/2), Math.round((S-nh)/2), nw, nh);

        x2.globalCompositeOperation='destination-over';
        x2.fillStyle=PHOTO_BG; x2.fillRect(0,0,S,S);     /* พื้นครีมเต็มผืน */
        x2.globalCompositeOperation='source-over';

        /* ตัดเป็นวงกลมแล้วไล่ให้จางหายไปกับพื้นหลัง */
        var g2=x2.createRadialGradient(S/2,S/2,S*0.30, S/2,S/2,S*0.47);
        g2.addColorStop(0,'rgba(0,0,0,1)');
        g2.addColorStop(1,'rgba(0,0,0,0)');
        x2.globalCompositeOperation='destination-in';
        x2.fillStyle=g2; x2.fillRect(0,0,S,S);
        x2.globalCompositeOperation='source-over';
        res=c2.toDataURL('image/png');
      }
    }catch(e){}
    cutCache[url]=res; cb(res);
  };
  im.onerror=function(){ cutCache[url]=''; cb('') };
  im.src=url;
}
function setPhoto(box,it,i){

/* ---- ส่วนผสม: ใช้ desc จาก Firestore ก่อน ถ้าไม่มีก็ประกอบจากชื่อเมนู ---- */
function mix(it){
  if(it.desc && it.desc!==it.n) return it.desc;
  var s=(it.n||'')+' '+(it.en||''), p=[];
  var has=function(){for(var i=0;i<arguments.length;i++){if(s.indexOf(arguments[i])>-1)return true}return false};
  if(it.c==='ท็อปปิ้ง') return 'ท็อปปิ้งเพิ่มในเครื่องดื่มได้ทุกแก้ว';
  if(has('มัทฉะ','Matcha'))            p.push('มัทฉะชิซุโอกะ');
  else if(has('ชาไทย','Thai Tea'))     p.push('ชาไทยแท้');
  else if(has('เขียว','Green','มะลิ','Jasmine')) p.push('ชาเขียวมะลิ');
  else if(has('ชานม','Milk Tea','ไต้หวัน','Taiwan')) p.push('ชาอัสสัม');
  else if(has('กาแฟ','Coffee'))        p.push('เอสเปรสโซ');
  else if(has('พีช','Peach'))          p.push('ชาพีช');
  else if(has('มัสแคท','Muscat','องุ่น')) p.push('ชาองุ่นไชน์มัสแคท');
  else if(has('เสาวรส','Passion'))     p.push('ชาเสาวรส');
  else if(has('ลิ้นจี่','Lychee'))      p.push('น้ำลิ้นจี่');
  else if(has('สตรอ','Strawberry'))    p.push('สตรอว์เบอร์รี่');
  else if(has('สละ','Sala'))           p.push('น้ำสละ');
  else if(has('ช็อค','Choc','ไมโล','Milo')) p.push('ผงโกโก้เข้มข้น');
  else if(has('มินท์','Mint'))          p.push('มินท์เย็น');
  else if(has('นมสด','Fresh Milk'))     p.push('นมสดพาสเจอไรซ์');
  if(has('นมสด','Fresh Milk','ลาเต้','Latte','ชานม','Milk Tea','นม') && p[0]!=='นมสดพาสเจอไรซ์') p.push('นมสด');
  if(has('มะพร้าว','Coconut')) p.push('กะทิมะพร้าว');
  if(has('ส้ม','Orange')) p.push('น้ำส้ม');
  if(has('ชมพู','Chompoo')) p.push('ไซรัปนมชมพู');
  if(has('คาราเมล','Caramel')) p.push('คาราเมล');
  if(has('บราวน์','Brown Sugar')) p.push('บราวน์ชูการ์');
  if(has('โซดา','Soda')) p.push('โซดาซ่า');
  if(has('ชีส','Cheese')) p.push('ชีสโฟมเค็มหอม');
  if(has('ไข่มุก','บุก','Konjac')) p.push('ไข่มุกบุก');
  if(!p.length) p.push('ชงสดใหม่ทุกแก้ว');
  p.push('ปรับหวาน–น้ำแข็งได้');
  return p.join(' · ');
}

/* ไอคอนวัตถุดิบ (ไฟล์ ic-*.png ในโฟลเดอร์ owl-img) */
function iconsFor(it){
  var s=(it.n||'')+' '+(it.en||''), out=[];
  var has=function(){for(var i=0;i<arguments.length;i++){if(s.indexOf(arguments[i])>-1)return true}return false};
  if(it.c==='ท็อปปิ้ง') return ['ic-pearl'];
  if(has('ชา','Tea','มัทฉะ','Matcha')) out.push('ic-tea');
  if(has('นม','Milk','ลาเต้','Latte','ชีส','Cheese')) out.push('ic-milk');
  if(has('ไข่มุก','บุก','Konjac','คริสตัล','Crystal','บราวน์','Brown')) out.push('ic-pearl');
  if(has('พีช','Peach','องุ่น','Muscat','สตรอ','Strawberry','ลิ้นจี่','Lychee','เสาวรส','Passion','ส้ม','Orange','สละ','Sala')) out.push('ic-peach');
  out.push('ic-ice');
  return out.slice(0,4);
}

function buildDeck(){
  var n=FLAT.length; if(!n) return;
  $('#deck').innerHTML =
    '<i class="spacer"></i>' + cardHTML(FLAT[n-1], n-1) +
    FLAT.map(cardHTML).join('') + cardHTML(FLAT[0], 0) + '<i class="spacer"></i>';
  idx=0; gi=FLAT[0].gi;
  fillThumbs(); buildRail(); center(1,false); layout(); paint();
}
function buildRail(){}   /* เลิกใช้แถบขีด — ใช้ตัวเลข x/y แทน */
function center(domIdx,smooth){
  var cs=cards(), c=cs[domIdx]; if(!c) return;
  var deck=$('#deck');
  deck.scrollTo({left:c.offsetLeft-(deck.clientWidth-c.offsetWidth)/2, behavior:smooth?'smooth':'auto'});
}
function nearest(){
  var deck=$('#deck'), cs=cards(), mid=deck.scrollLeft+deck.clientWidth/2, best=0, bd=1e9;
  cs.forEach(function(c,i){ var d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid); if(d<bd){bd=d;best=i} });
  return best;
}
/* ไฮไลต์แก้วที่อยู่กลางแถบ + หา index จริง */
function layout(){
  var cs=cards(); if(!cs.length)return;
  var j=nearest();
  cs.forEach(function(c,i){ c.classList.toggle('on',i===j) });
  var real=+cs[j].dataset.i;
  if(real!==idx){ idx=real; paint() }
}
function paint(){
  var it=FLAT[idx]; if(!it)return;
  var st=styleOf(it);
  var lay=layFlip?$('#lay0'):$('#lay1'), cur=layFlip?$('#lay1'):$('#lay0');
  lay.style.background='radial-gradient(120% 80% at 50% 8%, '+st.bg[0]+' 0%, '+st.bg[1]+' 58%, #F3E7D6 100%)';
  lay.classList.add('on'); cur.classList.remove('on'); layFlip=layFlip?0:1;
  document.querySelector('meta[name=theme-color]').setAttribute('content',st.bg[0]);
  setBg(it.c);

  /* แก้วใหญ่ด้านบน */
  var art=$('#heroArt');
  setPhoto(art,it,idx);
  art.classList.remove('pop'); void art.offsetWidth; art.classList.add('pop');

  var d=$('#info'); d.classList.add('fade');
  var seq=++paintSeq;
  setTimeout(function(){
    if(seq!==paintSeq) return;
    $('#dName').textContent=it.n;
    var en=$('#dEn'); if(en) en.textContent=it.en||'';
    $('#dDesc').textContent=mix(it);
    $('#dPrice').textContent=it.p;
    $('#dIcons').innerHTML=iconsFor(it).map(function(n){
      return '<img src="'+imgUrl('owl-img/'+n+'.png')+'" alt="" onerror="this.remove()">';
    }).join('');
    d.classList.remove('fade');
  },140);

  var bb=$('#buyBtn'); if(bb) bb.href=orderUrl(it);
  $('#dkOrder').href=orderUrl(it);
  if(it.gi!==gi){ gi=it.gi; markCat(); buildRail(); }
  $('#count').textContent=(it.ci+1)+' / '+GROUPS[gi].items.length;
  $('#best').hidden = (it.c!=='ขายดี');
}
function go(d){ center(nearest()+d,true) }
function jumpToCat(g){
  var first=0;
  for(var i=0;i<FLAT.length;i++){ if(FLAT[i].gi===g){ first=i; break } }
  center(first+1,true);
}
$('#prev').onclick=function(){go(-1)}; $('#next').onclick=function(){go(1)};
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1) });

/* scroll → ปรับสเกลแก้วข้างๆ + วนลูปเมื่อไปโดนใบโคลนหัว/ท้าย */
(function(){
  var deck=$('#deck'), tick=false, settle=null;
  deck.addEventListener('scroll',function(){
    if(!tick){ tick=true; requestAnimationFrame(function(){ layout(); tick=false }) }
    clearTimeout(settle);
    settle=setTimeout(function(){
      var cs=cards(), n=cs.length-2, j=nearest();      /* cs[0] และ cs[n+1] คือใบโคลน */
      if(j===0) center(n,false);                       /* ปัดถอยเลยใบแรก → เด้งไปใบสุดท้ายจริง */
      else if(j===n+1) center(1,false);                /* ปัดเลยใบสุดท้าย → เด้งกลับใบแรกจริง */
    },140);
  },{passive:true});
  window.addEventListener('resize',function(){ layout() });
})();

/* แตะแก้วข้างๆ เพื่อเลื่อนไปเมนูนั้น */
$('#deck').addEventListener('click',function(e){
  var c=e.target.closest && e.target.closest('.item'); if(!c)return;
  var cs=cards(), j=cs.indexOf(c);
  if(j<0 || j===nearest()) return;
  center(j,true);
});

/* hint hides after first swipe */
(function(){ var h=$('#hint'); if(!h) return;
  var hide=function(){h.style.opacity='0';setTimeout(function(){h.remove()},600)};
  $('#deck').addEventListener('scroll',hide,{once:true,passive:true}); setTimeout(hide,6000); })();

/* พื้นหลังรูป — โหลดล่วงหน้าแล้วสลับแบบ crossfade ตามหมวด */
var bgFlip=0, bgNow='', bgCache={};
function setBg(cat){
  var url=imgUrl((BG_MAP&&BG_MAP[cat])||BG_IMAGE||'');
  if(!url||url===bgNow) return;
  if(bgCache[url]==='bad') return;
  var apply=function(){
    var show=bgFlip?$('#bgA'):$('#bgB'), hide=bgFlip?$('#bgB'):$('#bgA');
    show.style.backgroundImage='url("'+url+'")';
    show.classList.add('on'); hide.classList.remove('on');
    bgFlip=bgFlip?0:1; bgNow=url; document.body.classList.add('hasBg');
  };
  if(bgCache[url]==='ok') return apply();
  var im=new Image();
  im.onload=function(){ bgCache[url]='ok'; apply() };
  im.onerror=function(){ bgCache[url]='bad' };   /* โหลดไม่ขึ้น = ใช้พื้นหลังไล่สีเดิม ไม่พัง */
  im.src=url;
}

/* links + hours */
$('#dkOrder').href=ORDER_URL; $('#dkDeli').href=DELIVERY_URL;
(function(){
  var el=$('#hours'); if(!el) return;
  var mins=function(t){var a=t.split(':');return (+a[0])*60+(+a[1])};
  var now=new Date(), m=now.getHours()*60+now.getMinutes();
  var o=mins(SHOP_OPEN), c=mins(SHOP_CLOSE);
  var open=(c>o) ? (m>=o&&m<c) : (m>=o||m<c);     /* เผื่อกรณีปิดข้ามเที่ยงคืน */
  el.querySelector('span').textContent=(open?'เปิดอยู่ · ':'ปิดแล้ว · ')+SHOP_OPEN+'–'+SHOP_CLOSE;
  if(!open) el.querySelector('.dot').style.background='#C4614A';
})();

/* boot */
function start(items){ GROUPS=group(items); if(!GROUPS.length)return; flatten(); buildCats(); buildDeck() }
loadMenu().then(function(x){ if(!x.length)throw new Error('empty'); start(x) })
  .catch(function(e){ console.warn('snapshot:',e); start(SNAPSHOT) });
</script>
